    function validURL(url) {
        try {
            url = decodeURIComponent(url);
        }
        catch (error) {
            return false;
        }
        var pos = url.indexOf(".html");
        if (pos == -1 || pos != url.length - 5)
            return false;
        var allowNumber = false;
        var allowSep = false;
        var seenDot = false;
        for (var i = 0; i &lt; url.length - 5; i++) {
            var ch = url.charAt(i);
            if ('a' &lt;= ch &amp;&amp; ch &lt;= 'z' ||
                    'A' &lt;= ch &amp;&amp; ch &lt;= 'Z' ||
                    ch == '$' ||
                    ch == '_' ||
                    ch.charCodeAt(0) &gt; 127) {
                allowNumber = true;
                allowSep = true;
            } else if ('0' &lt;= ch &amp;&amp; ch &lt;= '9'
                    || ch == '-') {
                if (!allowNumber)
                     return false;
            } else if (ch == '/' || ch == '.') {
                if (!allowSep)
                    return false;
                allowNumber = false;
                allowSep = false;
                if (ch == '.')
                     seenDot = true;
                if (ch == '/' &amp;&amp; seenDot)
                     return false;
            } else {
                return false;
            }
        }
